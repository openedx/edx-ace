[tox]
envlist = py{312}-django{42, 52}, docs, quality
requires = tox-uv>=1

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
; D101 = Missing docstring in public class
; D200 = One-line docstring should fit on one line with quotes
; D203 = 1 blank line required before class docstring
; D212 = Multi-line docstring summary should start at the first line
ignore = D101,D200,D203,D212
match-dir = (?!migrations)

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
allowlist_externals =
    make
commands =
    make test PYTEST_ARGS="{posargs}"

[testenv:docs]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
dependency_groups = doc
allowlist_externals =
    make
commands =
    # BROWSER=true skips opening the built docs in a browser
    make docs BROWSER=true

[testenv:quality]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE=test_settings
    PYTHONPATH = {toxinidir}/:{toxinidir}/src/edx_ace
dependency_groups = quality
allowlist_externals =
    make
commands =
    make quality
